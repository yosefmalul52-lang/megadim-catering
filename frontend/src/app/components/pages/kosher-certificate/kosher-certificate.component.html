<div class="kosher-page">
  
  <section class="header-section">
    <div class="container">
      <h1 class="main-title">{{ 'KOSHER_PAGE.TITLE' | translate }}</h1>
      <p class="description">
        {{ 'KOSHER_PAGE.DESC' | translate }}
        <br>
        <strong>{{ 'KOSHER_PAGE.CERT_LINE' | translate }}</strong>
      </p>
    </div>
  </section>
  
  <div class="container certificate-container">
    <div class="certificate-frame">
      <img [src]="certificateImageUrl" [attr.alt]="'KOSHER_PAGE.IMG_ALT' | translate" class="cert-img">
      
      <div class="corner top-right"></div>
      <div class="corner bottom-left"></div>
    </div>
  </div>
</div>
